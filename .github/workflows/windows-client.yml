name: Build Windows client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained Windows x64 client
        shell: pwsh
        env:
          GROUP_RELAY_DEFAULT_URL: ${{ vars.GROUP_RELAY_DEFAULT_URL }}
        run: |
          dotnet restore windows/GroupRelay.Windows.csproj
          # 默认服务器地址在构建时注入(仓库里不烧地址,临时隧道会过期)。
          # 仓库变量 GROUP_RELAY_DEFAULT_URL 有值就带上,没有就出一个首启会问地址的产物。
          dotnet publish windows/GroupRelay.Windows.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output windows/publish `
            -p:PublishReadyToRun=true `
            -p:GroupRelayDefaultUrl="${env:GROUP_RELAY_DEFAULT_URL}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path "windows/publish").Path
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DSourceDir=$publishDir" "windows/Installer.iss"

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = "windows/dist/Group-Relay-Windows-x64-Setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  Group-Relay-Windows-x64-Setup.exe" |
            Out-File "windows/dist/Group-Relay-Windows-x64-Setup.exe.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: Group-Relay-Windows-x64
          path: |
            windows/dist/Group-Relay-Windows-x64-Setup.exe
            windows/dist/Group-Relay-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
